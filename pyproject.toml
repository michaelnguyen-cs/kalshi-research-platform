[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kbot"
version = "0.1.0"
description = "Kalshi algorithmic trading bot — safety-first, dry-run by default"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core framework
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "typer[all]>=0.12",
    # HTTP / WebSocket
    "httpx>=0.27",
    "websockets>=12.0",
    # Cryptography (RSA-PSS signing for Kalshi auth)
    "cryptography>=42.0",
    # Numerics
    "numpy>=1.26",
    "scipy>=1.13",
    # IANA timezone data (required on Windows — Linux/macOS use the OS tzdata)
    "tzdata>=2024.1",
    # Env loading
    "python-dotenv>=1.0",
    # Kalshi official Python SDK (sync client).
    # Install with: pip install kalshi-python
    # Verify the PyPI package name matches `kalshi_python_sync` in Kalshi's docs;
    # if the name differs, install from their GitHub and remove this line.
    "kalshi-python>=2.0",
    # Google Sheets sync
    "gspread>=6.0",
    "google-auth>=2.0",
    # LLM research agent
    "anthropic>=0.30",
    # Self-learning loop
    "scikit-learn>=1.4",
    # Scheduling
    "APScheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[project.scripts]
kbot = "kbot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
